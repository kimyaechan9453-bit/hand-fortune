<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>오늘의 핸드 운세 · 통계</title>
<style>body{font-family:"Pretendard",system-ui,sans-serif;background:#F2F4F6;color:#191F28;margin:0;padding:20px;max-width:520px;margin:0 auto}h1{font-size:20px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #E5E8EB;font-size:14px}th:first-child,td:first-child{text-align:left}th{background:#F9FAFB;font-weight:700}p{color:#6B7684;font-size:13px}</style></head>
<body><h1>오늘의 핸드 운세 통계</h1><p>최근 7일, 한국 시간 기준이에요.</p><table id="t"><thead></thead><tbody></tbody></table>
<p>방문은 페이지를 연 횟수, 운세 뽑기는 결과를 본 횟수, 플레이스토어는 받기 버튼을 누른 횟수예요.</p>
<script>
var NS='handtalk-fortune',EV=[['visit','방문'],['deal','운세 뽑기'],['reroll','다시 뽑기'],['share','공유'],['store','플레이스토어'],['store-ios','아이폰(준비 중)']];
function day(o){var d=new Date(Date.now()+9*3600e3-o*864e5);return d.toISOString().slice(0,10).replace(/-/g,'')}
function get(k){return fetch('https://abacus.jasoncameron.dev/get/'+NS+'/'+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return 0})}
var days=['total'];for(var i=0;i<7;i++)days.push(day(i));
document.querySelector('thead').innerHTML='<tr><th>날짜</th>'+EV.map(function(e){return '<th>'+e[1]+'</th>'}).join('')+'</tr>';
Promise.all(days.map(function(d){return Promise.all(EV.map(function(e){return get(d==='total'?e[0]:e[0]+'-'+d)}))})).then(function(rows){
document.querySelector('tbody').innerHTML=rows.map(function(r,i){var d=days[i];return '<tr><td>'+(d==='total'?'<b>전체</b>':d.slice(4,6)+'/'+d.slice(6))+'</td>'+r.map(function(v){return '<td>'+v+'</td>'}).join('')+'</tr>'}).join('')})
</script></body></html>
