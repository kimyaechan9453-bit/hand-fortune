<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FB">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>홀덤 오늘의 운세</title>
<meta name="description" content="오늘 나의 핸드 2장과 보드 5장을 뽑아 보세요. 홀덤 족보로 보는 오늘의 운세예요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="핸드톡">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="홀덤 오늘의 운세">
<meta property="og:description" content="오늘 나의 핸드 2장과 보드 5장을 뽑아 보세요. 홀덤 족보로 보는 오늘의 운세예요.">
<meta property="og:url" content="https://kimyaechan9453-bit.github.io/hand-fortune/">
<meta property="og:image" content="https://kimyaechan9453-bit.github.io/hand-fortune/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="홀덤 오늘의 운세 · 핸드톡">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="홀덤 오늘의 운세">
<meta name="twitter:description" content="오늘 나의 핸드 2장과 보드 5장을 뽑아 보세요. 홀덤 족보로 보는 오늘의 운세예요.">
<meta name="twitter:image" content="https://kimyaechan9453-bit.github.io/hand-fortune/og-image.png">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><img src="logo.svg" alt="" width="24" height="24"><span>핸드톡</span></div>
    <h1>오늘의 핸드 운세</h1>
    <p class="date" id="date"></p>
  </header>

  <section id="start" class="panel" aria-labelledby="startTitle">
    <div class="deck" aria-hidden="true">
      <div class="card back"></div><div class="card back"></div>
    </div>
    <h2 id="startTitle" class="sr-only">시작하기</h2>
    <p class="intro">오늘의 내 핸드 2장과 보드 5장을 확인해 보세요.<br>닉네임을 입력하면 나만의 핸드가 나와요.</p>
    <label for="nick" class="lbl">닉네임 (선택)</label>
    <input id="nick" type="text" maxlength="16" autocomplete="nickname" placeholder="예: 리버의신">
    <button id="dealBtn" class="btn primary" type="button">오늘의 핸드 받기</button>
    <p class="fine">같은 날, 같은 닉네임이면 결과가 같아요.</p>
  </section>

  <section id="result" class="panel" hidden aria-labelledby="handName">
    <div class="hand" id="hand">
      <p class="row-lbl" id="holeLbl">내 핸드</p>
      <div class="hole" id="hole" role="list" aria-labelledby="holeLbl"></div>
      <p class="row-lbl" id="boardLbl">보드</p>
      <div class="board" id="board" role="list" aria-labelledby="boardLbl"></div>
    </div>
    <div class="rank-box">
      <p class="rank-label">오늘의 핸드</p>
      <h2 id="handName" class="rank-name"></h2>
      <p id="rerollNote" class="reroll-note" hidden></p>
      <div id="explain" class="ex" aria-live="polite">
        <div class="ex-row">
          <div class="ex-h"><span class="ex-t">프리플랍 핸드 세기</span><span id="exTier" class="ex-pill"></span><span id="exBars" class="ex-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
          <p class="ex-p"><b id="exName"></b> <span id="exHole"></span></p>
        </div>
        <div class="ex-row">
          <div class="ex-h"><span class="ex-t">최종 족보 세기</span><span id="exTier2" class="ex-pill"></span><span id="exBars2" class="ex-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
          <p class="ex-p"><b id="exName2"></b> <span id="exMade"></span></p>
        </div>
      </div>
      <p id="oneLine" class="one-line"></p>
    </div>

    <div class="score-card">
      <div class="ring" id="ring" role="img" aria-label="운세 점수">
        <span id="score">0</span><small>점</small>
      </div>
      <p id="message" class="message"></p>
    </div>

    <h3 class="sec">핸드 밸런스</h3>
    <ul class="meters" id="meters"></ul>


    <div class="actions">
      <button id="shareBtn" class="btn primary" type="button">결과 공유하기</button>
      <div class="sub-acts">
        <button id="rerollBtn" class="btn ghost" type="button">다시 뽑기</button>
        <button id="resetBtn" class="btn ghost" type="button">처음으로</button>
      </div>
    </div>
    <p class="fine">재미로 보는 운세예요. 오늘도 좋은 핸드 되세요.</p>
  </section>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-box">
      <h3 id="sheetTitle" class="sheet-t">공유 이미지</h3>
      <img id="sheetImg" class="sheet-img" alt="오늘의 핸드 운세 공유 이미지">
      <a id="saveImg" class="btn primary sheet-btn" href="#">이미지 저장</a>
      <button id="sheetClose" class="btn ghost" type="button">닫기</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="app.js?v=20"></script>
</body>
</html>
